name: Release

# Publishes a GitHub release (with an installable plugin zip) for every push
# to main. If the version in blt-popups.php has not been released yet it is
# released as-is; otherwise the patch version is bumped, committed back to
# main, and that new version is released. Put #minor or #major in a commit
# message to bump higher. The zip asset is what the bundled
# plugin-update-checker installs on client sites as an update.
#
# Uses only actions/checkout (GitHub-owned) plus the runner's preinstalled gh
# CLI, PHP and rsync -- no third-party actions -- so it runs under a strict
# org Actions allowlist.
#
# Loop prevention: the bump commit carries [skip release] and pushes made with
# GITHUB_TOKEN do not retrigger workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -oiP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' blt-popups.php | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not parse the plugin version from blt-popups.php" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists - will bump the patch version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet - will release the current version."
          fi

      - name: Determine bump level
        id: level
        run: |
          LEVEL=patch
          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          case "$MSG" in
            *'#major'*) LEVEL=major ;;
            *'#minor'*) LEVEL=minor ;;
          esac
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        if: steps.check.outputs.exists == 'true'
        run: |
          NEW=$(php .github/scripts/bump-version.php "${{ steps.level.outputs.level }}")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${NEW} [skip release]"
          git push origin HEAD:main
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW"

      - name: Resolve release version
        id: release
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "version=${{ steps.bump.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution zip
        run: |
          V="${{ steps.release.outputs.version }}"
          mkdir -p build/blt-popups
          rsync -a --exclude-from=.distignore --exclude='.git' --exclude='.github' ./ build/blt-popups/
          cd build && zip -rq "blt-popups-${V}.zip" blt-popups
          echo "Zip contents (top level):"
          unzip -l "blt-popups-${V}.zip" | head -n 15

      - name: Verify zip contents
        run: |
          V="${{ steps.release.outputs.version }}"
          Z="build/blt-popups-${V}.zip"
          LIST=$(unzip -l "$Z")
          echo "$LIST" | awk '{print $4}' | grep -q '^blt-popups/blt-popups\.php$'
          echo "$LIST" | grep -q 'blt-popups/includes/lib/plugin-update-checker/plugin-update-checker\.php'
          echo "$LIST" | grep -q 'blt-popups/includes/lib/plugin-update-checker/vendor/Parsedown'
          unzip -p "$Z" blt-popups/blt-popups.php | grep -q "Version:[[:space:]]*${V}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.release.outputs.version }}"
          gh release create "v${V}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${V}" \
            --generate-notes \
            --target main \
            "build/blt-popups-${V}.zip"
